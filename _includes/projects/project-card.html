<div class="terminal-card mb-3">
  <div class="row g-0">
    <div class="col-sm-6 col-md-4">
      <img src="{{ site.baseurl }}/{{ include.page.image }}" class="rounded-start w-100 h-100" style="object-fit: cover; min-height: 200px;" alt="{{ include.page.title }}">
    </div>
    <div class="col-sm-6 col-md-8">
      <div class="terminal-card-path">
        <span class="tilde">~</span>/projects/
      </div>
      <div class="terminal-card-body">
        <h5 class="terminal-card-title">{{ include.page.title }}</h5>
        <p class="terminal-card-date">{{ include.page.date }}</p>
        <p class="terminal-card-summary">{{ include.page.summary }}</p>
        <div class="terminal-card-labels">
          {% for label in include.page.labels %}
          <span class="badge rounded-pill">{{ label }}</span>
          {% endfor %}
        </div>
        {% if page.projecturl %}
        <a href="{{ page.projecturl }}" class="terminal-btn"><span class="prompt">&gt;</span> project_site</a>
        {% else %}
        <a href="{{ site.baseurl}}{{ include.page.url }}" class="terminal-btn"><span class="prompt">&gt;</span> read_more</a>
        {% endif %}
      </div>
    </div>
  </div>
</div>
