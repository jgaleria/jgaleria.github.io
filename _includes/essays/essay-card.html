<div class="col-md-6 col-lg-4">
  <div class="terminal-card h-100">
    <div class="terminal-card-body">
      <h5 class="terminal-card-title">{{ include.page.title }}</h5>
      <p class="terminal-card-date">{{ include.page.date | date_to_string }}</p>
      <p class="terminal-card-summary">{{ include.page.content | markdownify | strip_html | truncatewords: 40 }}</p>
      <div class="terminal-card-labels">
        {% for label in include.page.labels %}
        <span class="badge rounded-pill">{{ label }}</span>
        {% endfor %}
      </div>
    </div>
    <div class="terminal-card-footer" style="padding: 0 1.25rem 1.25rem;">
      <div class="text-center">
        <a href="{% if page.essayurl %}{{ page.essayurl }}{% else %}{{ site.baseurl}}{{ include.page.url }}{% endif %}" class="terminal-btn">Read More</a>
      </div>
    </div>
  </div>
</div>
